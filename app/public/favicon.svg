<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nexus">
  <style>
    /* Fundo escuro por padrão. Em navegador com tema escuro, o quadrado inverte
       para o papel claro — um #37352F sobre barra de abas escura desaparece. */
    .ground { fill: #37352f; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #ebebe9; }
    }
  </style>

  <rect class="ground" width="32" height="32" rx="7.5" />

  <!-- Os quatro pilares, nas mesmas cores do design system.
       Grade 2x2 porque sobrevive a 16px, onde linhas convergindo viram borrão. -->
  <circle cx="11.4" cy="11.4" r="3.3" fill="#4f9d69" />
  <circle cx="20.6" cy="11.4" r="3.3" fill="#4a87c4" />
  <circle cx="11.4" cy="20.6" r="3.3" fill="#d0764b" />
  <circle cx="20.6" cy="20.6" r="3.3" fill="#8b6bb5" />
</svg>
